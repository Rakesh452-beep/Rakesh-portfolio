      <rect x="736" y="302" width="380" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="782" cy="350" r="22" fill="#bbf7d0"/><text x="772" y="356" font-size="14" font-weight="700" fill="#15803d">RS</text>
      <text x="818" y="346" font-size="15" font-weight="700" fill="#1e293b">Rohan S.</text>
      <text x="818" y="366" font-size="12" fill="#64748b">Frontend · design systems</text>
      <text x="758" y="412" font-size="11" fill="#7c3aed">Next.js</text>
      <rect x="758" y="422" width="120" height="7" rx="3.5" fill="#ede9fe"/>
      <text x="894" y="412" font-size="11" fill="#4f46e5">Tailwind</text>
      <rect x="894" y="422" width="86" height="7" rx="3.5" fill="#e0e7ff"/>
      <rect x="758" y="444" width="140" height="24" rx="12" fill="#f59e0b"/>
      <text x="772" y="460" font-size="11" fill="#ffffff">Weekends only</text>

      <rect x="1132" y="302" width="408" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="1178" cy="350" r="22" fill="#fde68a"/><text x="1166" y="356" font-size="14" font-weight="700" fill="#b45309">MP</text>
      <text x="1214" y="346" font-size="15" font-weight="700" fill="#1e293b">Meera P.</text>
      <text x="1214" y="366" font-size="12" fill="#64748b">ML · data pipelines</text>
      <text x="1154" y="412" font-size="11" fill="#7c3aed">Python</text>
      <rect x="1154" y="422" width="110" height="7" rx="3.5" fill="#ede9fe"/>
      <text x="1280" y="412" font-size="11" fill="#4f46e5">Pandas</text>
      <rect x="1280" y="422" width="90" height="7" rx="3.5" fill="#e0e7ff"/>
      <rect x="1154" y="444" width="110" height="24" rx="12" fill="#16a34a"/>
      <text x="1168" y="460" font-size="11" fill="#ffffff">Available</text>

      <rect x="340" y="502" width="380" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="386" cy="550" r="22" fill="#fecaca"/><text x="376" y="556" font-size="14" font-weight="700" fill="#b91c1c">TJ</text>
      <text x="422" y="546" font-size="15" font-weight="700" fill="#1e293b">Tarun J.</text>
      <text x="422" y="566" font-size="12" fill="#64748b">Backend · APIs</text>
      <text x="362" y="612" font-size="11" fill="#7c3aed">Express</text>
      <rect x="362" y="622" width="104" height="7" rx="3.5" fill="#ede9fe"/>
      <text x="484" y="612" font-size="11" fill="#4f46e5">Postgres</text>
      <rect x="484" y="622" width="80" height="7" rx="3.5" fill="#e0e7ff"/>
      <rect x="362" y="644" width="120" height="24" rx="12" fill="#f59e0b"/>
      <text x="376" y="660" font-size="11" fill="#ffffff">Evenings</text>

      <rect x="736" y="502" width="380" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="782" cy="550" r="22" fill="#e9d5ff"/><text x="770" y="556" font-size="14" font-weight="700" fill="#7e22ce">SK</text>
      <text x="818" y="546" font-size="15" font-weight="700" fill="#1e293b">Sana K.</text>
      <text x="818" y="566" font-size="12" fill="#64748b">Product · UI design</text>
      <text x="758" y="612" font-size="11" fill="#7c3aed">Figma</text>
      <rect x="758" y="622" width="90" height="7" rx="3.5" fill="#ede9fe"/>
      <rect x="758" y="644" width="110" height="24" rx="12" fill="#16a34a"/>
      <text x="772" y="660" font-size="11" fill="#ffffff">Available</text>

      <rect x="1132" y="502" width="408" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="1178" cy="550" r="22" fill="#a5f3fc"/><text x="1168" y="556" font-size="14" font-weight="700" fill="#0e7490">VN</text>
      <text x="1214" y="546" font-size="15" font-weight="700" fill="#1e293b">Vikram N.</text>
      <text x="1214" y="566" font-size="12" fill="#64748b">DevOps · cloud</text>
      <text x="1154" y="612" font-size="11" fill="#7c3aed">Docker</text>
      <rect x="1154" y="622" width="96" height="7" rx="3.5" fill="#ede9fe"/>
      <rect x="1154" y="644" width="130" height="24" rx="12" fill="#f59e0b"/>
      <text x="1168" y="660" font-size="11" fill="#ffffff">Weekdays PM</text>
    </g>

    <!-- message panel -->
    <rect x="340" y="706" width="1200" height="64" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="366" y="744" font-size="13" fill="#94a3b8">Message Aditi about your project…</text>
    <rect x="1424" y="718" width="96" height="40" rx="20" fill="#4f46e5"/>
    <text x="1454" y="744" font-size="13" font-weight="700" fill="#ffffff">Send</text>
