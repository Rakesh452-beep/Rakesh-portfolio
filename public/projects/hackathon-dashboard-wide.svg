      <text x="422" y="346" font-size="15" font-weight="700" fill="#1e293b">Aditi K.</text>
      <text x="422" y="366" font-size="12" fill="#64748b">Full-stack · 3 hackathons</text>
      <text x="362" y="412" font-size="11" fill="#7c3aed">React</text>
