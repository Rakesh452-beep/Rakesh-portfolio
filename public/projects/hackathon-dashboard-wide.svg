      <rect x="510" y="422" width="100" height="7" rx="3.5" fill="#e0e7ff"/>
      <text x="626" y="412" font-size="11" fill="#4f46e5">Supabase</text>
      <rect x="626" y="422" width="76" height="7" rx="3.5" fill="#e0e7ff"/>
      <rect x="362" y="444" width="110" height="24" rx="12" fill="#16a34a"/>
