<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <clipPath id="haw-clip"><rect width="1600" height="900" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#haw-clip)">
    <rect width="1600" height="900" fill="#eef2fb"/>

    <!-- browser bar -->
    <rect width="1600" height="50" fill="#f7f9fd"/>
    <circle cx="30" cy="25" r="6" fill="#ff5f57"/>
    <circle cx="50" cy="25" r="6" fill="#febc2e"/>
    <circle cx="70" cy="25" r="6" fill="#28c840"/>
    <rect x="100" y="13" width="440" height="24" rx="12" fill="#e7ecf7"/>
    <text x="116" y="29" font-size="12" fill="#6b7280">hackathon-dashboard.vercel.app — TeamUp</text>

    <!-- app header -->
    <rect x="0" y="50" width="1600" height="70" fill="#4f46e5"/>
    <rect x="60" y="72" width="28" height="28" rx="8" fill="#a5b4fc"/>
    <text x="100" y="92" font-size="18" font-weight="700" fill="#ffffff">TeamUp</text>
    <text x="1180" y="92" font-size="13" fill="#c7d2fe">Dashboard</text>
    <text x="1290" y="92" font-size="13" fill="#c7d2fe">Matches</text>
    <text x="1380" y="92" font-size="13" fill="#c7d2fe">Messages</text>
    <circle cx="1500" cy="86" r="16" fill="#6366f1"/>
    <text x="1494" y="91" font-size="12" fill="#ffffff">RK</text>

    <!-- sidebar -->
    <rect x="0" y="120" width="300" height="780" fill="#ffffff"/>
    <rect x="0" y="120" width="300" height="780" fill="none"/>
    <text x="34" y="178" font-size="13" font-weight="700" fill="#1e293b">Filters</text>
    <text x="34" y="218" font-size="12" fill="#64748b">Skill</text>
    <g font-size="11">
      <rect x="34" y="232" width="66" height="26" rx="13" fill="#e0e7ff"/><text x="50" y="249" fill="#4338ca">React</text>
      <rect x="108" y="232" width="82" height="26" rx="13" fill="#e0e7ff"/><text x="124" y="249" fill="#4338ca">Supabase</text>
      <rect x="198" y="232" width="66" height="26" rx="13" fill="#ede9fe"/><text x="214" y="249" fill="#6d28d9">Python</text>
      <rect x="34" y="266" width="58" height="26" rx="13" fill="#e0e7ff"/><text x="50" y="283" fill="#4338ca">Node</text>
      <rect x="100" y="266" width="76" height="26" rx="13" fill="#ede9fe"/><text x="116" y="283" fill="#6d28d9">UI/UX</text>
    </g>
    <text x="34" y="330" font-size="12" fill="#64748b">Availability</text>
    <rect x="34" y="344" width="232" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="34" y="344" width="150" height="14" rx="7" fill="#4f46e5"/>
    <text x="34" y="392" font-size="12" fill="#64748b">Experience</text>
    <rect x="34" y="406" width="232" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="34" y="406" width="90" height="14" rx="7" fill="#6366f1"/>

    <!-- content -->
    <text x="340" y="178" font-size="24" font-weight="700" fill="#1e293b">Find your team</text>
    <text x="340" y="206" font-size="13" fill="#64748b">Match by skill and availability, not by scrolling group chats.</text>

    <rect x="340" y="230" width="760" height="46" rx="12" fill="#ffffff" stroke="#dbe2f0"/>
    <circle cx="370" cy="253" r="7" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="375" y1="258" x2="381" y2="264" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="396" y="258" font-size="13" fill="#94a3b8">Search by skill, e.g. React…</text>
    <rect x="1116" y="230" width="110" height="46" rx="12" fill="#ffffff" stroke="#dbe2f0"/>
    <text x="1140" y="258" font-size="13" fill="#475569">Filters</text>
    <rect x="1240" y="230" width="300" height="46" rx="12" fill="#4338ca"/>
    <text x="1350" y="259" font-size="13" font-weight="700" fill="#ffffff">Search teammates</text>

