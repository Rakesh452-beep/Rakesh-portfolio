<svg xmlns="http://www.w3.org/2000/svg" width="760" height="880" viewBox="0 0 760 880" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="ha-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#e2e8f6"/>
    </linearGradient>
    <clipPath id="ha-clip"><rect width="760" height="880" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#ha-clip)">
    <rect width="760" height="880" fill="url(#ha-bg)"/>

    <!-- browser bar -->
    <rect width="760" height="46" fill="#f7f9fd"/>
    <circle cx="26" cy="23" r="5" fill="#ff5f57"/>
    <circle cx="44" cy="23" r="5" fill="#febc2e"/>
    <circle cx="62" cy="23" r="5" fill="#28c840"/>
    <rect x="88" y="12" width="320" height="22" rx="11" fill="#e7ecf7"/>
    <text x="102" y="27" font-size="11" fill="#6b7280">hackathon-dashboard.vercel.app</text>

    <!-- app header -->
    <rect x="0" y="46" width="760" height="64" fill="#4f46e5"/>
    <rect x="28" y="66" width="26" height="26" rx="7" fill="#a5b4fc"/>
    <text x="64" y="85" font-size="16" font-weight="700" fill="#ffffff">TeamUp</text>
    <text x="420" y="84" font-size="12" fill="#c7d2fe">Dashboard</text>
    <text x="510" y="84" font-size="12" fill="#c7d2fe">Matches</text>
    <text x="585" y="84" font-size="12" fill="#c7d2fe">Messages</text>
    <circle cx="710" cy="79" r="15" fill="#6366f1"/>
    <text x="704" y="84" font-size="11" fill="#ffffff">RK</text>

    <!-- title -->
    <text x="28" y="152" font-size="20" font-weight="700" fill="#1e293b">Find your team</text>
    <text x="28" y="174" font-size="12" fill="#64748b">Match by skill and availability, not by scrolling group chats.</text>

    <!-- search + filters -->
    <rect x="28" y="196" width="440" height="40" rx="10" fill="#ffffff" stroke="#dbe2f0"/>
    <circle cx="52" cy="216" r="7" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="57" y1="221" x2="63" y2="227" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="76" y="221" font-size="12" fill="#94a3b8">Search by skill, e.g. React…</text>
    <rect x="484" y="196" width="120" height="40" rx="10" fill="#4338ca"/>
    <text x="516" y="221" font-size="12" font-weight="700" fill="#ffffff">Search</text>
    <rect x="616" y="196" width="116" height="40" rx="10" fill="#ffffff" stroke="#dbe2f0"/>
    <text x="640" y="221" font-size="12" fill="#475569">Filters</text>

    <!-- chips -->
    <g font-size="11">
      <rect x="28" y="252" width="66" height="26" rx="13" fill="#e0e7ff"/><text x="44" y="269" fill="#4338ca">React</text>
      <rect x="102" y="252" width="82" height="26" rx="13" fill="#e0e7ff"/><text x="118" y="269" fill="#4338ca">Supabase</text>
      <rect x="192" y="252" width="58" height="26" rx="13" fill="#e0e7ff"/><text x="208" y="269" fill="#4338ca">Node</text>
      <rect x="258" y="252" width="66" height="26" rx="13" fill="#ede9fe"/><text x="274" y="269" fill="#6d28d9">Python</text>
      <rect x="332" y="252" width="76" height="26" rx="13" fill="#ede9fe"/><text x="348" y="269" fill="#6d28d9">UI/UX</text>
    </g>

    <!-- profile cards -->
    <g>
      <rect x="28" y="300" width="344" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="66" cy="342" r="20" fill="#c7d2fe"/>
      <text x="58" y="347" font-size="13" font-weight="700" fill="#4338ca">AK</text>
      <text x="98" y="338" font-size="14" font-weight="700" fill="#1e293b">Aditi K.</text>
      <text x="98" y="356" font-size="11" fill="#64748b">Full-stack · 3 hackathons</text>
      <text x="46" y="398" font-size="10" fill="#7c3aed">React</text>
      <rect x="46" y="408" width="120" height="6" rx="3" fill="#ede9fe"/>
      <text x="46" y="404" font-size="0" fill="#7c3aed">.</text>
      <text x="180" y="398" font-size="10" fill="#4f46e5">Node</text>
      <rect x="180" y="408" width="90" height="6" rx="3" fill="#e0e7ff"/>
      <text x="284" y="398" font-size="10" fill="#4f46e5">Supabase</text>
      <rect x="284" y="408" width="70" height="6" rx="3" fill="#e0e7ff"/>
      <rect x="46" y="426" width="100" height="22" rx="11" fill="#16a34a"/>
      <text x="58" y="441" font-size="10" fill="#ffffff">Available</text>

      <rect x="388" y="300" width="344" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="426" cy="342" r="20" fill="#bbf7d0"/>
      <text x="418" y="347" font-size="13" font-weight="700" fill="#15803d">RS</text>
      <text x="458" y="338" font-size="14" font-weight="700" fill="#1e293b">Rohan S.</text>
      <text x="458" y="356" font-size="11" fill="#64748b">Frontend · design systems</text>
      <text x="406" y="398" font-size="10" fill="#7c3aed">Next.js</text>
      <rect x="406" y="408" width="110" height="6" rx="3" fill="#ede9fe"/>
      <text x="530" y="398" font-size="10" fill="#4f46e5">Tailwind</text>
      <rect x="530" y="408" width="80" height="6" rx="3" fill="#e0e7ff"/>
      <rect x="406" y="426" width="128" height="22" rx="11" fill="#f59e0b"/>
      <text x="418" y="441" font-size="10" fill="#ffffff">Weekends only</text>

      <rect x="28" y="476" width="344" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="66" cy="518" r="20" fill="#fde68a"/>
      <text x="56" y="523" font-size="13" font-weight="700" fill="#b45309">MP</text>
      <text x="98" y="514" font-size="14" font-weight="700" fill="#1e293b">Meera P.</text>
      <text x="98" y="532" font-size="11" fill="#64748b">ML · data pipelines</text>
      <text x="46" y="574" font-size="10" fill="#7c3aed">Python</text>
      <rect x="46" y="584" width="100" height="6" rx="3" fill="#ede9fe"/>
      <text x="160" y="574" font-size="10" fill="#4f46e5">Pandas</text>
      <rect x="160" y="584" width="80" height="6" rx="3" fill="#e0e7ff"/>
      <rect x="46" y="602" width="100" height="22" rx="11" fill="#16a34a"/>
      <text x="58" y="617" font-size="10" fill="#ffffff">Available</text>

      <rect x="388" y="476" width="344" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="426" cy="518" r="20" fill="#fecaca"/>
      <text x="416" y="523" font-size="13" font-weight="700" fill="#b91c1c">TJ</text>
      <text x="458" y="514" font-size="14" font-weight="700" fill="#1e293b">Tarun J.</text>
      <text x="458" y="532" font-size="11" fill="#64748b">Backend · APIs</text>
      <text x="406" y="574" font-size="10" fill="#7c3aed">Express</text>
      <rect x="406" y="584" width="96" height="6" rx="3" fill="#ede9fe"/>
      <text x="514" y="574" font-size="10" fill="#4f46e5">Postgres</text>
      <rect x="514" y="584" width="70" height="6" rx="3" fill="#e0e7ff"/>
      <rect x="406" y="602" width="116" height="22" rx="11" fill="#f59e0b"/>
      <text x="418" y="617" font-size="10" fill="#ffffff">Evenings</text>
    </g>

    <!-- message bar -->
    <rect x="28" y="666" width="704" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="48" y="701" font-size="12" fill="#94a3b8">Message Aditi about your project…</text>
    <rect x="620" y="678" width="96" height="36" rx="18" fill="#4f46e5"/>
    <text x="648" y="701" font-size="12" font-weight="700" fill="#ffffff">Send</text>

    <rect x="28" y="752" width="704" height="1" fill="#e2e8f0"/>
    <text x="28" y="800" font-size="11" fill="#94a3b8">Built with React.js + Supabase · 2024</text>
  </g>
</svg>
