    <linearGradient id="dj-hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2418"/>
      <stop offset="1" stop-color="#12100d"/>
    </linearGradient>
    <clipPath id="dj-clip"><rect width="760" height="880" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#dj-clip)">
    <rect width="760" height="880" fill="url(#dj-bg)"/>

    <!-- browser bar -->
    <rect width="760" height="46" fill="#1b1712"/>
    <circle cx="26" cy="23" r="5" fill="#ff5f57"/>
    <circle cx="44" cy="23" r="5" fill="#febc2e"/>
    <circle cx="62" cy="23" r="5" fill="#28c840"/>
    <rect x="88" y="12" width="300" height="22" rx="11" fill="#2a241b"/>
    <text x="102" y="27" font-size="11" fill="#8f8574">dhanunjaystudio.com</text>

    <!-- site nav -->
    <text x="40" y="86" font-size="17" font-weight="700" letter-spacing="3" fill="#d9b061">DHANUNJAY</text>
    <text x="205" y="86" font-size="11" letter-spacing="2" fill="#b9ae98">WORK</text>
    <text x="265" y="86" font-size="11" letter-spacing="2" fill="#b9ae98">SERVICES</text>
    <text x="345" y="86" font-size="11" letter-spacing="2" fill="#b9ae98">STUDIO</text>
    <rect x="612" y="70" width="108" height="26" rx="13" fill="#d9b061"/>
