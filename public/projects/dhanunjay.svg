    <text x="66" y="812" font-size="15" fill="#f4efe4">Pick a date, time slot &amp; confirm.</text>
    <rect x="500" y="772" width="194" height="44" rx="22" fill="#d9b061"/>
    <text x="548" y="799" font-size="13" font-weight="700" fill="#241d13">CHECK AVAILABILITY</text>
