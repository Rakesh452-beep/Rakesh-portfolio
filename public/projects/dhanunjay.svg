    <circle cx="560" cy="270" r="150" fill="none" stroke="#d9b061" stroke-width="1" opacity="0.5"/>
    <circle cx="600" cy="320" r="230" fill="none" stroke="#d9b061" stroke-width="1" opacity="0.25"/>
    <text x="40" y="250" font-size="13" letter-spacing="6" fill="#d9b061">PHOTOGRAPHY · CINEMATOGRAPHY</text>
    <text x="40" y="316" font-size="52" font-weight="700" fill="#f4efe4">Three Lenses</text>
    <text x="40" y="372" font-size="52" font-weight="700" fill="#d9b061" opacity="0.9">Studio</text>
    <text x="40" y="416" font-size="13" fill="#b9ae98">Weddings, portraits, film and brand stories — shot with intent.</text>

    <!-- portfolio grid -->
    <text x="40" y="516" font-size="12" letter-spacing="4" fill="#d9b061">SELECTED WORK</text>
    <rect x="40" y="536" width="212" height="150" rx="8" fill="#2c2418" stroke="#3a3022"/>
    <rect x="274" y="536" width="212" height="150" rx="8" fill="#332a1b" stroke="#3a3022"/>
    <rect x="508" y="536" width="212" height="150" rx="8" fill="#2c2418" stroke="#3a3022"/>
    <circle cx="146" cy="586" r="26" fill="none" stroke="#d9b061" stroke-width="1" opacity="0.6"/>
    <path d="M380 566 l30 40 -60 0 z" fill="none" stroke="#d9b061" stroke-width="1.4" opacity="0.6"/>
    <rect x="596" y="562" width="36" height="48" fill="none" stroke="#d9b061" stroke-width="1.4" opacity="0.6"/>
    <text x="40" y="712" font-size="11" fill="#b9ae98">Wedding Films</text>
    <text x="274" y="712" font-size="11" fill="#b9ae98">Portrait Series</text>
    <text x="508" y="712" font-size="11" fill="#b9ae98">Brand Campaign</text>

