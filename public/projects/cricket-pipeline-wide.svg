<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <clipPath id="cpw-clip"><rect width="1600" height="900" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#cpw-clip)">
    <rect width="1600" height="900" fill="#0f1720"/>

    <!-- terminal bar -->
    <rect width="1600" height="50" fill="#1c2733"/>
    <circle cx="30" cy="25" r="6" fill="#ff5f57"/>
    <circle cx="50" cy="25" r="6" fill="#febc2e"/>
    <circle cx="70" cy="25" r="6" fill="#28c840"/>
    <text x="100" y="29" font-size="12" fill="#7d8b99">cricket_pipeline.py — scheduled daily @ 06:00 (Windows Task Scheduler)</text>

    <!-- left: logs -->
    <text x="50" y="110" font-size="16" font-weight="700" fill="#4ade80">$</text>
    <text x="70" y="110" font-size="15" fill="#cbd5e1">python run_pipeline.py --date 2025-04-12</text>
    <g font-family="Consolas, monospace" font-size="14">
      <text x="50" y="152" fill="#64748b">[06:00:01] fetching KSCA U-19 fixtures…</text>
      <text x="50" y="182" fill="#94a3b8">[06:00:03] 12 matches found · parsing JSONP endpoints</text>
      <text x="50" y="212" fill="#4ade80">[06:00:05] parsed 12/12 matches ✓</text>
      <text x="50" y="242" fill="#94a3b8">[06:00:06] isolating wicketkeeper figures…</text>
      <text x="50" y="272" fill="#4ade80">[06:00:07] 12 keeper records extracted ✓</text>
      <text x="50" y="302" fill="#94a3b8">[06:00:08] writing report.xlsx via openpyxl…</text>
      <text x="50" y="332" fill="#94a3b8">[06:00:09] syncing to Google Sheets API…</text>
      <text x="50" y="362" fill="#4ade80">[06:00:11] sheet updated ✓</text>
      <text x="50" y="392" fill="#94a3b8">[06:00:12] emailing report to 4 recipients…</text>
      <text x="50" y="422" fill="#4ade80">[06:00:13] sent via Gmail SMTP ✓</text>
      <text x="50" y="452" fill="#facc15">[06:00:13] done in 12.4s — next run tomorrow 06:00</text>
    </g>

    <!-- pipeline diagram -->
    <rect x="50" y="500" width="720" height="320" rx="14" fill="#16202b" stroke="#24313f"/>
    <text x="74" y="538" font-size="13" font-weight="700" fill="#e2e8f0">Pipeline</text>
    <g>
      <rect x="74" y="560" width="150" height="64" rx="10" fill="#1f2c39"/>
      <text x="98" y="590" font-size="12" fill="#7dd3fc">Scrape JSONP</text>
      <text x="98" y="608" font-size="10" fill="#64748b">KSCA U-19</text>

      <rect x="250" y="560" width="150" height="64" rx="10" fill="#1f2c39"/>
      <text x="272" y="590" font-size="12" fill="#a78bfa">Parse &amp; isolate</text>
      <text x="272" y="608" font-size="10" fill="#64748b">Pandas</text>

      <rect x="426" y="560" width="150" height="64" rx="10" fill="#1f2c39"/>
      <text x="450" y="590" font-size="12" fill="#4ade80">Report</text>
      <text x="450" y="608" font-size="10" fill="#64748b">openpyxl</text>

      <rect x="602" y="560" width="144" height="64" rx="10" fill="#1f2c39"/>
      <text x="624" y="590" font-size="12" fill="#facc15">Sync + email</text>
      <text x="624" y="608" font-size="10" fill="#64748b">Sheets · SMTP</text>

      <g stroke="#33465a" stroke-width="1.5" fill="none">
        <line x1="224" y1="592" x2="250" y2="592"/>
        <line x1="400" y1="592" x2="426" y2="592"/>
        <line x1="576" y1="592" x2="602" y2="592"/>
      </g>
      <g fill="#4ade80">
        <polygon points="250,588 250,596 256,592"/>
        <polygon points="426,588 426,596 432,592"/>
        <polygon points="602,588 602,596 608,592"/>
      </g>
    </g>
    <text x="74" y="684" font-size="12" fill="#94a3b8">0 manual steps. Runs before anyone is awake.</text>
    <rect x="74" y="712" width="200" height="44" rx="22" fill="#22c55e"/>
    <text x="118" y="739" font-size="14" font-weight="700" fill="#06240f">RUN AGAIN NOW</text>
    <rect x="292" y="712" width="170" height="44" rx="22" fill="none" stroke="#33465a"/>
    <text x="330" y="739" font-size="14" fill="#94a3b8">Open sheet</text>

    <!-- right: report -->
    <rect x="820" y="110" width="730" height="710" rx="14" fill="#16202b" stroke="#24313f"/>
    <text x="848" y="152" font-size="16" font-weight="700" fill="#e2e8f0">Wicketkeeper Report — KSCA U-19</text>
    <text x="848" y="176" font-size="12" fill="#64748b">Generated automatically · 12 Apr 2025</text>

    <rect x="848" y="200" width="674" height="40" rx="8" fill="#1f2c39"/>
    <g font-size="12" fill="#8fa3b5">
      <text x="864" y="225">PLAYER</text>
      <text x="1080" y="225">MATCH</text>
      <text x="1290" y="225">CATCHES</text>
      <text x="1400" y="225">STUMPINGS</text>
    </g>

    <g font-size="13" fill="#cbd5e1">
      <rect x="848" y="248" width="674" height="46" fill="#0f1720" opacity="0.5"/>
      <text x="864" y="277">A. Sharma</text>
      <text x="1080" y="277">KSCA vs Mysore</text>
      <text x="1320" y="277">4</text>
      <text x="1430" y="277">1</text>

      <rect x="848" y="294" width="674" height="46" fill="#16202b"/>
      <text x="864" y="323">R. Iyer</text>
      <text x="1080" y="323">KSCA vs Hubli</text>
      <text x="1320" y="323">3</text>
      <text x="1430" y="323">2</text>

      <rect x="848" y="340" width="674" height="46" fill="#0f1720" opacity="0.5"/>
      <text x="864" y="369">K. Nair</text>
      <text x="1080" y="369">KSCA vs Belgaum</text>
      <text x="1320" y="369">2</text>
      <text x="1430" y="369">0</text>

      <rect x="848" y="386" width="674" height="46" fill="#16202b"/>
      <text x="864" y="415">S. Patil</text>
      <text x="1080" y="415">KSCA vs Davangere</text>
      <text x="1320" y="415">5</text>
      <text x="1430" y="415">3</text>

      <rect x="848" y="432" width="674" height="46" fill="#0f1720" opacity="0.5"/>
      <text x="864" y="461">M. Reddy</text>
      <text x="1080" y="461">KSCA vs Tumkur</text>
      <text x="1320" y="461">1</text>
      <text x="1430" y="461">1</text>

      <rect x="848" y="478" width="674" height="46" fill="#16202b"/>
      <text x="864" y="507">V. Singh</text>
      <text x="1080" y="507">KSCA vs Mangalore</text>
      <text x="1320" y="507">4</text>
      <text x="1430" y="507">0</text>
    </g>

    <!-- chart -->
    <text x="848" y="574" font-size="13" font-weight="700" fill="#e2e8f0">Stumpings by match</text>
    <g fill="#38bdf8">
      <rect x="860" y="710" width="60" height="30" rx="4"/>
      <rect x="940" y="680" width="60" height="60" rx="4"/>
      <rect x="1020" y="726" width="60" height="14" rx="4"/>
      <rect x="1100" y="666" width="60" height="74" rx="4"/>
      <rect x="1180" y="726" width="60" height="14" rx="4"/>
      <rect x="1260" y="710" width="60" height="30" rx="4"/>
      <rect x="1340" y="680" width="60" height="60" rx="4"/>
    </g>
    <line x1="850" y1="740" x2="1410" y2="740" stroke="#33465a" stroke-width="1"/>
  </g>
</svg>
